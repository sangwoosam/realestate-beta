<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>오너스 데모 · 프라이머</title>
<style>
  :root{
    --bg:#0a0e16; --card:#121826; --card2:#0f1521; --line:#1e2636;
    --ink:#e8edf6; --sub:#9aa7bd; --mut:#5c6a82;
    --primary:#4d8bff; --primaryD:#1e2f52; --green:#22c55e; --red:#f0556b;
    --blue:#4d8bff; --gray:#5c6a82; --purple:#a78bfa; --warn:#f5a524;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:#05080f;font-family:-apple-system,'Apple SD Gothic Neo','Pretendard',sans-serif;}
  #app{max-width:460px;margin:0 auto;height:100vh;background:var(--bg);color:var(--ink);
    display:flex;flex-direction:column;position:relative;overflow:hidden;}
  .topbar{padding:16px 18px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);}
  .topbar .menu{font-size:20px;color:var(--sub);}
  .topbar .bld{font-size:17px;font-weight:800;}
  .screen{flex:1;overflow-y:auto;padding:14px;}
  .hide{display:none;}
  /* 임대현황 */
  .unit{background:var(--card);border-radius:14px;margin-bottom:10px;border-left:4px solid var(--gray);overflow:hidden;}
  .unit.green{border-left-color:var(--green);} .unit.red{border-left-color:var(--red);} .unit.blue{border-left-color:var(--blue);}
  .urow{display:flex;align-items:center;gap:10px;padding:14px 14px;cursor:pointer;}
  .ubadge{background:var(--primaryD);color:#bcd3ff;font-weight:800;font-size:13px;border-radius:8px;padding:5px 9px;min-width:42px;text-align:center;}
  .uname{font-weight:800;font-size:15px;flex:1;}
  .ustat{font-weight:800;font-size:13px;}
  .ustat.green{color:var(--green);} .ustat.red{color:var(--red);} .ustat.blue{color:var(--blue);} .ustat.gray{color:var(--mut);}
  .uamt{font-weight:800;font-size:15px;color:var(--primary);}
  .uamt.gray{color:var(--mut);font-weight:600;font-size:13px;}
  .chev{color:var(--mut);font-size:12px;}
  .udetail{padding:0 16px 14px;border-top:1px solid var(--line);}
  .arow{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;}
  .arow .l{color:var(--sub);} .arow .v{font-weight:700;}
  .atot{display:flex;justify-content:space-between;padding-top:9px;border-top:1px solid var(--line);margin-top:4px;}
  .atot .v{color:var(--primary);font-weight:800;}
  .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-size:12px;color:var(--sub);}
  .chip{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-weight:700;color:var(--ink);}
  .btns{display:flex;gap:7px;margin-top:11px;}
  .abtn{flex:1;text-align:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:13px;font-weight:800;cursor:pointer;}
  .abtn.p{background:var(--primaryD);border-color:var(--primary);color:#bcd3ff;}
  /* 통계 */
  .sec{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;}
  .sec h3{font-size:14px;color:var(--sub);font-weight:800;margin-bottom:12px;}
  .sum3{display:flex;text-align:center;}
  .sum3 .c{flex:1;} .sum3 .lbl{font-size:12px;color:var(--mut);margin-bottom:6px;}
  .sum3 .val{font-size:18px;font-weight:900;}
  .bar{display:flex;height:14px;border-radius:8px;overflow:hidden;margin:6px 0 12px;}
  .legend{display:flex;flex-wrap:wrap;gap:7px;}
  .lg{font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;}
  .erow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .erow:last-child{border-bottom:none;}
  .ecat{color:var(--sub);} .eamt{font-weight:800;color:var(--purple);}
  .pnl{display:flex;justify-content:space-between;padding:11px 0;font-size:15px;border-bottom:1px solid var(--line);}
  .pnl.big .v{font-size:20px;font-weight:900;color:var(--green);}
  /* 임차인등록 */
  .regc{background:var(--card);border-radius:14px;padding:18px;margin-bottom:11px;display:flex;align-items:center;gap:14px;cursor:pointer;}
  .regc .ic{font-size:26px;width:48px;height:48px;border-radius:24px;background:var(--primaryD);display:flex;align-items:center;justify-content:center;}
  .regc .t{font-size:16px;font-weight:800;} .regc .d{font-size:12.5px;color:var(--sub);margin-top:3px;}
  /* 탭바 */
  .tabbar{display:flex;border-top:1px solid var(--line);background:var(--card2);padding-bottom:env(safe-area-inset-bottom);}
  .tab{flex:1;text-align:center;padding:9px 0 12px;cursor:pointer;}
  .tab .ti{font-size:20px;opacity:.5;} .tab .tl{font-size:11px;color:var(--mut);margin-top:2px;font-weight:700;}
  .tab.on .ti{opacity:1;} .tab.on .tl{color:var(--primary);}
  .stitle{font-size:18px;font-weight:900;margin:2px 4px 14px;}
  /* 잠금 시트 */
  .mask{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:20;}
  .mask.show{display:flex;}
  .sheet{background:var(--card);width:100%;border-radius:26px 26px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom));}
  .sheet .h{width:38px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 18px;}
  .sheet .st{font-size:20px;font-weight:900;text-align:center;margin-bottom:12px;}
  .sheet .sb{font-size:14.5px;color:var(--sub);text-align:center;line-height:1.6;white-space:pre-line;margin-bottom:22px;}
  .sheet .ok{background:var(--primary);color:#fff;border:none;border-radius:14px;padding:15px;width:100%;font-size:16px;font-weight:800;cursor:pointer;}
  /* 환영 */
  #welcome{position:absolute;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px;text-align:center;}
  #welcome .em{font-size:70px;margin-bottom:22px;}
  #welcome .wt{font-size:27px;font-weight:900;margin-bottom:16px;}
  #welcome .wb{font-size:15px;color:var(--sub);line-height:1.7;white-space:pre-line;}
  #welcome .wbtn{margin-top:34px;background:var(--primary);color:#fff;border:none;border-radius:16px;padding:15px 52px;font-size:16px;font-weight:800;cursor:pointer;}
  #welcome .skip{margin-top:12px;color:var(--mut);font-size:13px;font-weight:700;cursor:pointer;}
  .dots{display:flex;gap:7px;margin-top:22px;}
  .d{width:8px;height:8px;border-radius:4px;background:var(--line);} .d.on{background:var(--primary);width:20px;}
</style>
</head>
<body>
<div id="app">
  <!-- 환영 -->
  <div id="welcome"></div>

  <div class="topbar"><span class="menu">☰</span><span class="bld">강남대로 464 (프라이머)</span></div>

  <!-- 임대현황 -->
  <div class="screen" id="sc-rental"></div>
  <!-- 통계 -->
  <div class="screen hide" id="sc-stats"></div>
  <!-- 임차인등록 -->
  <div class="screen hide" id="sc-reg"></div>
  <!-- 알림 -->
  <div class="screen hide" id="sc-noti"></div>

  <div class="tabbar" id="tabbar"></div>

  <!-- 잠금 시트 -->
  <div class="mask" id="mask" onclick="if(event.target.id==='mask')closeLock()">
    <div class="sheet">
      <div class="h"></div>
      <div class="st">🔒 데모 모드</div>
      <div class="sb">이 기능은 데모에선 잠겨 있어요.

전체 기능은 베타 앱에서 보실 수 있고,
더 빠른 완성엔 — 프라이머의 투자(1억원 · post-value 10억)와
액셀러레이팅이 필요합니다 😉</div>
      <button class="ok" onclick="closeLock()">확인</button>
    </div>
  </div>
</div>

<script>
const won = n => n.toLocaleString() + '원';
function lock(){ document.getElementById('mask').classList.add('show'); }
function closeLock(){ document.getElementById('mask').classList.remove('show'); }

const units = [
  {n:'101',name:'김철수',stat:'완납',sc:'green',amt:680000,dep:10000000,rent:600000,mnt:80000,in:'2025-03-01',end:'2027-02-28',occ:1},
  {n:'102',name:'이영희',stat:'완납',sc:'green',amt:1430000,dep:20000000,rent:1200000,mnt:100000,vat:130000,in:'2024-06-01',end:'2026-05-31',occ:1,biz:1},
  {n:'201',name:'박민수',stat:'연체 1달',sc:'red',amt:570000,dep:10000000,rent:500000,mnt:70000,in:'2025-01-10',end:'2027-01-09',occ:1},
  {n:'202',name:'최지훈',stat:'납부예정',sc:'blue',amt:430000,dep:5000000,rent:380000,mnt:50000,in:'2025-07-07',end:'2027-07-06',occ:1},
  {n:'301',name:'정수진',stat:'완납',sc:'green',amt:480000,dep:15000000,rent:420000,mnt:60000,in:'2025-05-01',end:'2027-04-30',occ:1},
  {n:'302',name:'공실',stat:'',sc:'gray',amt:0,prev:400000,occ:0},
];

function rentalHTML(){
  let h = '<div class="stitle">임대현황 · 5세대 입주 / 1 공실</div>';
  units.forEach((u,i)=>{
    h += `<div class="unit ${u.sc}" id="u${i}">
      <div class="urow" onclick="toggle(${i})">
        <span class="ubadge">${u.n}</span>
        <span class="uname">${u.occ?u.name:'공실'}${u.biz?' <span style="font-size:11px;color:#a78bfa">📄대기</span>':''}</span>
        ${u.occ?`<span class="ustat ${u.sc}">${u.stat}</span>`:''}
        <span class="uamt ${u.occ?'':'gray'}">${u.occ?won(u.amt):'직전 '+won(u.prev)}</span>
        <span class="chev">▾</span>
      </div>
      <div class="udetail hide" id="d${i}">${detailHTML(u)}</div>
    </div>`;
  });
  return h;
}
function detailHTML(u){
  if(!u.occ){
    return `<div class="arow"><span class="l">직전 보증금</span><span class="v" style="color:var(--mut)">800만원</span></div>
      <div class="arow"><span class="l">직전 월세</span><span class="v" style="color:var(--mut)">350,000원</span></div>
      <div class="atot"><span class="l">직전 합계(월)</span><span class="v" style="color:var(--mut)">${won(u.prev)}</span></div>
      <div class="btns"><div class="abtn p" onclick="lock()">👤 임차인 등록</div><div class="abtn" onclick="lock()">🏠 방상태·계약서</div></div>`;
  }
  return `<div style="margin-top:12px"></div>
    <div class="arow"><span class="l">보증금</span><span class="v">${won(u.dep)}</span></div>
    <div class="arow"><span class="l">월세</span><span class="v">${won(u.rent)}</span></div>
    <div class="arow"><span class="l">관리비</span><span class="v">${won(u.mnt)}</span></div>
    ${u.vat?`<div class="arow"><span class="l">부가세</span><span class="v" style="color:var(--warn)">${won(u.vat)}</span></div>`:''}
    <div class="atot"><span class="l">합계</span><span class="v">${won(u.amt)}</span></div>
    <div class="meta"><span class="chip">${u.vat?'상가':'월세'}</span> 입주 ${u.in} · 만기 ${u.end}</div>
    <div class="btns"><div class="abtn" onclick="lock()">🚪 퇴거예정</div><div class="abtn" onclick="lock()">📋 납부현황</div><div class="abtn" onclick="lock()">📞 전화</div></div>
    <div class="btns"><div class="abtn p" onclick="lock()">📋 계약정보</div><div class="abtn" onclick="lock()">🔄 재계약</div></div>`;
}
function toggle(i){ document.getElementById('d'+i).classList.toggle('hide'); }

function statsHTML(){
  const exps=[['청소',150000],['공용전기',88000],['공용수도',42000],['인터넷',66000],['수선·수리',230000],['소모품비',23900]];
  const exptot=exps.reduce((s,e)=>s+e[1],0);
  return `<div class="stitle">통계 · 2026년 6월</div>
  <div class="sec"><div class="sum3">
    <div class="c"><div class="lbl">실제 입금</div><div class="val" style="color:var(--green)">2,590,000</div></div>
    <div class="c"><div class="lbl">지출</div><div class="val" style="color:var(--red)">${exptot.toLocaleString()}</div></div>
    <div class="c"><div class="lbl">순이익</div><div class="val" style="color:var(--primary)">${(2590000-exptot).toLocaleString()}</div></div>
  </div></div>
  <div class="sec"><h3>납부 현황</h3>
    <div class="bar"><div style="flex:3;background:var(--green)"></div><div style="flex:1;background:var(--red)"></div><div style="flex:1;background:var(--blue)"></div><div style="flex:1;background:var(--gray)"></div></div>
    <div class="legend"><span class="lg" style="color:var(--green)">● 완납 3</span><span class="lg" style="color:var(--red)">● 연체 1</span><span class="lg" style="color:var(--blue)">● 납부예정 1</span><span class="lg" style="color:var(--mut)">● 공실 1</span></div>
  </div>
  <div class="sec"><h3>지출 내역 · ${exptot.toLocaleString()}원</h3>
    ${exps.map(e=>`<div class="erow"><span class="ecat">${e[0]}</span><span class="eamt">-${e[1].toLocaleString()}원</span></div>`).join('')}
  </div>
  <div class="sec"><h3>누적 손익계산서 · 최근 12개월</h3>
    <div class="pnl"><span>총매출</span><span class="v" style="font-weight:800">38,400,000원</span></div>
    <div class="pnl"><span>비용(고정+비정기)</span><span class="v" style="font-weight:800;color:var(--red)">-2,604,000원</span></div>
    <div class="pnl big"><span style="font-weight:900">순이익</span><span class="v">35,796,000원</span></div>
  </div>`;
}

function regHTML(){
  const items=[['📷','계약서 사진으로 등록','계약서를 찍으면 자동으로 정보를 읽어요'],['✍️','계약서 직접 작성','정보를 입력해 임대차계약서를 만들어요'],['📋','등록된 임차인 수정·삭제','세입자 정보 수정·삭제'],['🏢','상가 사업자등록증 등록','사업자등록증을 사진/직접으로 등록']];
  return `<div class="stitle">임차인 등록</div>${items.map(it=>`<div class="regc" onclick="lock()"><div class="ic">${it[0]}</div><div><div class="t">${it[1]}</div><div class="d">${it[2]}</div></div></div>`).join('')}`;
}
function notiHTML(){
  return `<div class="stitle">알림</div>
  <div class="sec" onclick="lock()" style="cursor:pointer"><h3 style="margin:0">🔔 강남대로 464 (프라이머)</h3>
    <div style="margin-top:12px;color:var(--sub);font-size:14px">미확인 입금 · 미확인 출금 · 만기 알림을 한곳에서 관리해요.</div>
    <div style="margin-top:14px;color:var(--primary);font-weight:800;font-size:14px">눌러서 확인하기 ›</div></div>`;
}

const TABS=[['rental','🏠','임대현황'],['stats','📊','통계'],['reg','✍️','임차인등록'],['noti','🔔','알림'],['more','≡','더보기']];
let cur='rental';
function renderTabs(){
  document.getElementById('tabbar').innerHTML = TABS.map(t=>`<div class="tab ${t[0]===cur?'on':''}" onclick="goTab('${t[0]}')"><div class="ti">${t[1]}</div><div class="tl">${t[2]}</div></div>`).join('');
}
function goTab(t){
  if(t==='more'){ lock(); return; }   // 더보기 잠금
  cur=t;
  ['rental','stats','reg','noti'].forEach(s=>document.getElementById('sc-'+s).classList.add('hide'));
  document.getElementById('sc-'+t).classList.remove('hide');
  renderTabs();
}

// 환영 슬라이드
const SL=[['👋','Welcome, 프라이머','오너스 투자자 데모에 오신 것을 환영합니다.\n건물주를 위한 자동화 임대관리 장부.'],
  ['🏢','강남대로 464 빌딩','세입자 5명이 입주한 건물을 둘러보세요.\n임대현황·통계는 실제처럼 작동합니다.'],
  ['🔒','데모는 여기까지','일부 기능은 잠겨 있어요.\n전체는 베타 앱에서 — 더 빠른 완성엔\n프라이머의 투자(1억원·post-value 10억)와\n액셀러레이팅이 필요합니다 😉']];
let si=0;
function renderWelcome(){
  const s=SL[si], last=si>=SL.length-1;
  document.getElementById('welcome').innerHTML=`<div class="em">${s[0]}</div><div class="wt">${s[1]}</div><div class="wb">${s[2]}</div>
    <div class="dots">${SL.map((_,i)=>`<div class="d ${i===si?'on':''}"></div>`).join('')}</div>
    <button class="wbtn" onclick="${last?'startApp()':'nextSlide()'}">${last?'둘러보기 시작 →':'다음'}</button>
    ${last?'':'<div class="skip" onclick="startApp()">건너뛰기</div>'}`;
}
function nextSlide(){ si++; renderWelcome(); }
function startApp(){ document.getElementById('welcome').style.display='none'; }

// init
document.getElementById('sc-rental').innerHTML=rentalHTML();
document.getElementById('sc-stats').innerHTML=statsHTML();
document.getElementById('sc-reg').innerHTML=regHTML();
document.getElementById('sc-noti').innerHTML=notiHTML();
renderTabs();
renderWelcome();
</script>
</body>
</html>
